      `, (box, close) => box.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close)));
      return;
    }
    openModal(`
      <h3>删除任务</h3>
      <div class="cnt" style="color:var(--text-muted);line-height:1.8;font-size:12.5px">
        确定删除「${t.title}」？<br />删除后可以在回收站里还原（原型里不落库，只是从看板移除）。
      </div>
      <div class="foot">
        <button data-close>取消</button>
        <button class="danger" id="dOk">删除</button>
      </div>
    `, (box, close) => {
      box.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
      box.querySelector('#dOk').addEventListener('click', () => {
        close();
        removeTask(id);
      });
    });
  }

  function removeTask(id) {
    const t = byId.get(id);
    if (!t || t.children.length) return;
    const i = tasks.indexOf(t);
    if (i >= 0) tasks.splice(i, 1);
    byId.delete(id);
    for (const p of [t.parent, ...t.ancestors]) if (p && byId.get(p)) byId.get(p).children = byId.get(p).children.filter((k) => k !== id);
    for (const x of tasks) {
      x.blockedBy = x.blockedBy.filter((b) => b !== id);
      x.deps = x.deps.filter((d) => d !== id);
    }
    // 顶层数组也要跟着更新（统计、六边形图、生成器都读它们）
    for (const arr of [mains, subs, grands]) {
      const j = arr.indexOf(t);
      if (j >= 0) arr.splice(j, 1);
    }
    if (board.pinned === id) board.pinned = null;
    if (view.drawer === id) closeDrawer();
    recomputeStats();
    refreshBoard();
    showToast('已删除（原型不落库，刷新页面就回来）');
  }

  /* ---------- 详情抽屉（字段即改即生效） ---------- */

  const drawer = document.getElementById('drawer');
  const dHead = document.getElementById('dHead');
  const dBody = document.getElementById('dBody');
  const dFoot = document.getElementById('dFoot');

  function openDrawer(id) {
    const t = byId.get(id);
    if (!t) return;
    view.drawer = id;
    board.pinned = id;          // 打开详情 = 钉住关系层（强聚焦）
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    const st = STATUS_META[t.status];

    dHead.innerHTML = `
      <div class="l1">
        <span class="kind">${t.depth === 0 ? '主任务' : t.depth === 1 ? '子任务' : '孙任务'}</span>
        <span class="status" style="--st:${st.color}">${st.label}</span>
        <button class="close" data-close title="关闭（Esc）">×</button>
      </div>
    `;

    const parents = ['', ...mains.filter((m) => m.id !== t.id).map((m) => m.id)];
    dBody.innerHTML = `
      <div class="fld"><label>标题</label><input id="fTitle" value="${t.title.replace(/"/g, '&quot;')}" /></div>
      <div class="fld" style="display:flex;gap:10px">
        <div style="flex:1"><label>状态</label><select id="fStatus">
          ${STATUSES.map((s) => `<option value="${s}"${s === t.status ? ' selected' : ''}>${STATUS_META[s].label}</option>`).join('')}
        </select></div>
        <div style="flex:1"><label>里程碑</label><select id="fMs">
          ${MILESTONES.map((m) => `<option value="${m.id}"${m.id === t.milestone ? ' selected' : ''}>${m.name}</option>`).join('')}
        </select></div>
      </div>
      <div class="fld"><label>归属</label><select id="fParent">
        ${parents.map((p) => `<option value="${p}"${(t.parent ?? '') === p ? ' selected' : ''}>${p ? byId.get(p).title : '无（主任务）'}</option>`).join('')}
      </select>${t.children.length ? `<div class="hint">它自己有 ${t.children.length} 个子任务，不能改成别的任务的下级</div>` : ''}</div>
      <div class="fld"><label>标签（逗号分隔）</label><input id="fTags" value="${t.tags.join(', ')}" /></div>
      <div class="fld"><label>前置任务（挡着它的）</label>
        <div class="deps-list" id="fDeps">
          ${t.blockedBy.map((b) => `<span class="dep-chip" data-go="${b}">${byId.get(b).title}<span class="x" data-un="${b}">×</span></span>`).join('') || '<span class="hint">没有前置</span>'}
        </div>
        <select id="fAddDep" style="margin-top:6px">
          <option value="">＋ 添加前置…</option>
          ${tasks.filter((x) => x.id !== t.id && !t.blockedBy.includes(x.id) && !t.ancestors.includes(x.id)).map((x) => `<option value="${x.id}">${x.title}</option>`).join('')}
        </select>
      </div>
      ${t.children.length ? `<div class="fld"><label>子任务 ${t.children.length}</label>
        <div class="deps-list">${t.children.map((k) => {
          const c = byId.get(k);
          return `<span class="dep-chip" data-go="${c.id}">${c.title}<span style="color:${STATUS_META[c.status].color}">·</span></span>`;
        }).join('')}</div></div>` : ''}
      ${t.deps.length ? `<div class="fld"><label>后续任务（它挡着的）</label>
        <div class="deps-list">${t.deps.map((k) => `<span class="dep-chip" data-go="${k}">${byId.get(k).title}</span>`).join('')}</div></div>` : ''}
      <div class="fld"><label>描述</label><textarea id="fDesc" placeholder="写清楚验收标准…">${t.desc ?? ''}</textarea></div>
      <div class="fld"><label>时间</label>
        <div class="hint">创建 ${t.created ?? '—'} · 截止 ${t.due ?? '未设置'}（这一版日期不是重点，先后顺序更重要）</div>
      </div>
    `;

    dFoot.innerHTML = `
      <button class="danger" id="fDel">删除</button>
      <span class="saved" id="fSaved">改动即生效</span>
    `;

    const mark = () => {
      document.getElementById('fSaved').textContent = '已更新 · ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      recomputeStats();
      refreshBoard(id);
    };

    dBody.querySelector('[data-close]')?.addEventListener('click', closeDrawer);
    dHead.querySelector('[data-close]')?.addEventListener('click', closeDrawer);
    dBody.querySelector('#fTitle').addEventListener('input', (ev) => { t.title = ev.target.value; mark(); });
    dBody.querySelector('#fStatus').addEventListener('change', (ev) => {
      t.status = ev.target.value;
      dHead.querySelector('.status').textContent = STATUS_META[t.status].label;
      dHead.querySelector('.status').style.setProperty('--st', STATUS_META[t.status].color);
      mark();
    });
    dBody.querySelector('#fMs').addEventListener('change', (ev) => { t.milestone = ev.target.value; mark(); });
    dBody.querySelector('#fParent').addEventListener('change', (ev) => {
      const np = ev.target.value || null;
      if (t.depth > 0 && byId.get(t.parent)) byId.get(t.parent).children = byId.get(t.parent).children.filter((k) => k !== id);
      t.parent = np ?? undefined;
      t.depth = np ? byId.get(np).depth + 1 : 0;
      if (np) byId.get(np).children.push(id);
      t.ancestors = [];
      let cur = np ? byId.get(np) : null;
      while (cur) { t.ancestors.push(cur.id); cur = cur.parent ? byId.get(cur.parent) : null; }
      t.root = t.ancestors.length ? t.ancestors[t.ancestors.length - 1] : t.id;
      mark();
      showToast('已调整归属');
    });
    dBody.querySelector('#fTags').addEventListener('input', (ev) => {
      t.tags = ev.target.value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
      mark();
    });
    dBody.querySelector('#fAddDep').addEventListener('change', (ev) => {
      const v = ev.target.value;
      if (!v) return;
      t.blockedBy.push(v);
      byId.get(v).deps.push(id);
      openDrawer(id);
      mark();
    });
    dBody.querySelectorAll('[data-un]').forEach((x) => x.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const b = x.dataset.un;
      t.blockedBy = t.blockedBy.filter((k) => k !== b);
      byId.get(b).deps = byId.get(b).deps.filter((k) => k !== id);
      openDrawer(id);
      mark();
    }));
    dBody.querySelectorAll('[data-go]').forEach((x) => x.addEventListener('click', (ev) => {
      if (ev.target.dataset.un) return;
      ev.stopPropagation();
      const target = x.dataset.go;
      openDrawer(target);
      revealTask(target);
    }));
    dFoot.querySelector('#fDel').addEventListener('click', () => askDelete(id));

    paintRelations();
  }

  function closeDrawer() {
    view.drawer = null;
    board.pinned = null;
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    paintRelations();
  }

  /* ---------- 任务台的控件 ---------- */

  document.getElementById('btnNew').addEventListener('click', () => openCreate());
  document.getElementById('btnOnlyMain').addEventListener('click', (ev) => {
    board.onlyMain = !board.onlyMain;
    ev.currentTarget.classList.toggle('on', board.onlyMain);
    refreshBoard();
  });
  document.getElementById('btnExpandAll').addEventListener('click', () => {
    board.collapsed.clear();
    refreshBoard();
  });
  document.getElementById('btnCollapseAll').addEventListener('click', () => {
    for (const t of tasks) if (t.children.length) board.collapsed.add(t.id);
    refreshBoard();
  });
  let qTimer = 0;
  document.getElementById('q').addEventListener('input', (ev) => {
    board.query = ev.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => refreshBoard(), 120);
  });
  window.addEventListener('resize', () => { if (board.built) refreshBoard(); });

  /* ==================================================================
     7) 启动 + 自检
     ================================================================== */

  renderStats();
  renderSide();
  drawMap();

  function readHash() {
    const raw = location.hash.replace(/^#/, '');
    if (!raw) return {};
    return Object.fromEntries(raw.split('&').filter(Boolean).map((kv) => {
      const i = kv.indexOf('=');
      return i < 0 ? [kv, '1'] : [kv.slice(0, i), decodeURIComponent(kv.slice(i + 1))];
    }));
  }
  const hash = readHash();

  if (hash.page === 'tasks') document.querySelector('.side .nav[data-page="tasks"]').click();
  if (hash.task) setTimeout(() => { document.querySelector('.side .nav[data-page="tasks"]').click(); revealTask(hash.task); }, 160);
  if (hash.drawer) setTimeout(() => { document.querySelector('.side .nav[data-page="tasks"]').click(); openDrawer(hash.drawer); }, 260);
  if (hash.collapse) setTimeout(() => { for (const t of tasks) if (t.children.length) board.collapsed.add(t.id); refreshBoard(); }, 200);
  if (hash.new) setTimeout(() => { document.querySelector('.side .nav[data-page="tasks"]').click(); openCreate(); }, 220);
  if (hash.hoverTask) setTimeout(() => { document.querySelector('.side .nav[data-page="tasks"]').click(); board.hover = hash.hoverTask; paintRelations(); }, 420);
  if (hash.drill) setTimeout(() => drill(hash.drill), 120);
  if (hash.hover) setTimeout(() => setHover(hash.hover), 700);

  /** 自检：数字自洽 / 几何不变量 / DOM 数量 —— 这些靠看截图判断不了 */
  function selfCheck() {
    const problems = [];

    // 1) 统计自洽（统计页最容易出的错就是数字对不上）
    const sumStatus = stats.byStatus.reduce((a, b) => a + b.n, 0);
    if (sumStatus !== stats.total) problems.push(`状态数之和 ${sumStatus} ≠ 总数 ${stats.total}`);
    if (stats.main !== mains.length) problems.push('主任务数不一致');
    if (stats.mainDone > stats.main) problems.push('主任务完成数大于主任务数');
    if (stats.subDone > stats.sub) problems.push('子任务完成数大于子任务数');
    for (const m of MILESTONES) {
      const n = tasks.filter((t) => t.milestone === m.id).length;
      if (!n) problems.push(`里程碑 ${m.id} 没有任务`);
    }
    if (tasks.some((t) => t.deps.some((d) => !byId.get(d)))) problems.push('依赖指向了不存在的任务');

    // 2) 地图：48 个任务必须落在 48 个互不相同的蜂窝格子里（六边形网格里这是不重叠的充要条件）
    let mapHexes = 0;
    let cellDupe = [];
    if (view.mode === 'map') {
      mapHexes = svg.querySelectorAll('g.hx').length;
      const seen = new Set();
      mapOrder.slice(0, mapCells.length).forEach((t, i) => {
        const c = mapCells[i];
        const k = `${c.q},${c.r}`;
        if (seen.has(k)) cellDupe.push(t.id);
        seen.add(k);
      });
      if (cellDupe.length) problems.push(`地图格子重复：${cellDupe.slice(0, 3).join(',')}`);
      if (mapHexes !== Math.min(mains.length, mapCells.length)) {
        problems.push(`地图画了 ${mapHexes} 格，期望 ${Math.min(mains.length, mapCells.length)}`);
      }
      // 路径里的 NaN 是最典型的"坐标算错"信号
      for (const p of svg.querySelectorAll('path')) {
        if (String(p.getAttribute('d')).includes('NaN')) { problems.push('地图里有 NaN 路径'); break; }
      }
      // 格子里的字不能超出六边形（量文字包围盒）
      for (const tx of svg.querySelectorAll('text.hx-label')) {
        const bb = tx.getBBox();
        if (bb.width > MAP_S * 1.5) problems.push(`地图文字过宽：${tx.textContent} ${bb.width.toFixed(0)}px`);
      }
    }

    // 3) 下钻：用六边形的真实几何判定有没有互相压（共边距离 √3(s1+s2)/2）
    let hexRecords = [];
    if (view.mode === 'cluster') {
      for (const n of hexes.children) {
        hexRecords.push({
          id: n.dataset.id,
          x: Number(n.dataset.x),
          y: Number(n.dataset.y),
          s: Number(n.dataset.size),
        });
      }
      for (let i = 0; i < hexRecords.length; i += 1) {
        for (let j = i + 1; j < hexRecords.length; j += 1) {
          const a = hexRecords[i];
          const b = hexRecords[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          const need = hexGap(a.s, b.s);
          if (d < need) problems.push(`六边形互相压：${a.id} / ${b.id}（${d.toFixed(1)} < ${need.toFixed(1)}）`);
        }
      }
      // 标题被裁（固定尺寸的六边形最容易出这个；减过字的按设计走，不算问题）
      for (const n of hexes.children) {
        const tl = n.querySelector('.tl');
        if (tl && tl.scrollHeight > tl.clientHeight + 1) {
          problems.push(`${n.dataset.id} 标题被裁（减字后仍放不下）`);
        }
      }
    }

    // 4) 任务台：虚拟滚动的账要平、行位置要对得上偏移、关系层不能有 NaN
    let boardInfo = null;
    if (board.built) {
      const cols = [];
      for (const col of board.cols) {
        const sum = col.rows.reduce((a, r) => a + (col.heights.get(r.key + '|' + rowVariant(r)) ?? estimateOf(r)), 0) + 6;
        if (Math.abs(sum - col.total) > 2) problems.push(`${col.st} 列高度账不平：算出来 ${sum}，spacer ${col.total}`);
        for (const [k, node] of col.nodes) {
          const i = Number(node.dataset.idx);
          if (col.offsets[i] === undefined) { problems.push(`${col.st} 渲染了一行不在列表里的卡片：${k}`); continue; }
          if (Math.abs(parseFloat(node.style.top) - col.offsets[i]) > 1.5) {
            problems.push(`${col.st} 的行位置与偏移对不上：${k}`);
          }
        }
        cols.push({ st: col.st, rows: col.rows.length, dom: col.nodes.size, h: Math.round(col.total) });
      }
      for (const p of relLayer.querySelectorAll('path')) {
        if (String(p.getAttribute('d')).includes('NaN')) { problems.push('关系层出现 NaN 路径'); break; }
      }
      boardInfo = {
        columns: cols,
        rowsTotal: cols.reduce((a, c) => a + c.rows, 0),
        domTotal: cols.reduce((a, c) => a + c.dom, 0),
        collapsed: board.collapsed.size,
        onlyMain: board.onlyMain,
        query: board.query,
        drawer: view.drawer,
        relLines: relLayer.querySelectorAll('path').length,
      };
    }

    const report = {
      mode: view.mode,
      focus: view.focus,
      stack: view.stack.length,
      tilt: view.tilt,
      spin: Number(view.spin.toFixed(1)),
      zoom: Number(getComputedStyle(zoomEl).getPropertyValue('--zoom') || 0),
      totals: {
        tasks: stats.total, main: stats.main, sub: stats.sub, grand: stats.grand,
        done: stats.totalDone, byStatus: stats.byStatus.map((x) => `${x.st}:${x.n}`).join(','),
      },
      mapHexes,
      clusterHexes: hexRecords.length,
      maxHexSize: hexRecords.length ? Math.max(...hexRecords.map((x) => x.s)) : 0,
      depArcs: svg.querySelectorAll('.dep-arc').length,
      board: boardInfo,
      problems,
    };

    const pre = document.createElement('pre');
    pre.id = 'selfcheck';
    pre.textContent = 'SELFCHECK ' + JSON.stringify(report);
    document.body.appendChild(pre);
  }

  if (hash.check) setTimeout(selfCheck, 2200);

  // 调试/验证用的钩子：check-mock.cjs 靠它做程序化断言（点哪个任务、量什么数，不用靠眼睛）
  window.__mock = {
    tasks, byId, view, drill, upOne, setHover, stats, mains, progressOf,
    board, refreshBoard, paintRelations, openDrawer, closeDrawer, askDelete, removeTask,
    openCreate, revealTask, toggleCollapse, recomputeStats, findTask: (id) => byId.get(id),
  };
})();
</script>
</body>
</html>
